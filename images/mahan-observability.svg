<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="t d"><title id="t">Application observability and infrastructure monitoring</title><desc id="d">Illustrative flow from Java and Windows applications through log collection, ELK and SCOM monitoring to investigation.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08172f"/><stop offset="1" stop-color="#15375f"/></linearGradient></defs><rect width="1600" height="820" rx="28" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="90" y="90" fill="#93c5fd" font-size="23" letter-spacing="4">OBSERVABILITY &amp; MONITORING</text><text x="90" y="150" fill="#fff" font-size="43" font-weight="700">From application signals to operational insight</text><g stroke="#60a5fa" stroke-width="4" fill="none"><path d="M420 390H545M850 390H975M1280 390H1370"/></g><g fill="#102b50" stroke="#3b82f6" stroke-width="2"><rect x="90" y="270" width="330" height="240" rx="22"/><rect x="545" y="270" width="305" height="240" rx="22"/><rect x="975" y="270" width="305" height="240" rx="22"/><rect x="1370" y="315" width="160" height="150" rx="22"/></g><g fill="#fff"><text x="255" y="335" text-anchor="middle" font-size="28" font-weight="700">Systems &amp; apps</text><text x="255" y="390" text-anchor="middle" fill="#c7d9f2" font-size="21">Java / JavaScript</text><text x="255" y="430" text-anchor="middle" fill="#c7d9f2" font-size="21">ERP · Windows</text><text x="255" y="470" text-anchor="middle" fill="#93c5fd" font-size="18">Logs · performance signals</text><text x="697" y="335" text-anchor="middle" font-size="28" font-weight="700">Collection</text><text x="697" y="390" text-anchor="middle" fill="#c7d9f2" font-size="21">Logstash</text><text x="697" y="430" text-anchor="middle" fill="#c7d9f2" font-size="21">Centralized log flow</text><text x="1127" y="335" text-anchor="middle" font-size="28" font-weight="700">Monitoring</text><text x="1127" y="390" text-anchor="middle" fill="#c7d9f2" font-size="21">Elasticsearch · Kibana</text><text x="1127" y="430" text-anchor="middle" fill="#c7d9f2" font-size="21">Kibana APM · SCOM</text><text x="1450" y="375" text-anchor="middle" font-size="23" font-weight="700">Review</text><text x="1450" y="410" text-anchor="middle" fill="#c7d9f2" font-size="18">Investigate</text></g><path d="M255 560V620H1127V560" stroke="#38bdf8" stroke-width="3" fill="none" stroke-dasharray="10 10"/><text x="690" y="680" fill="#93c5fd" text-anchor="middle" font-size="22">Operational feedback · log queries · performance investigation</text><text x="90" y="770" fill="#9db7d7" font-size="18">Conceptual workflow only. Tools and responsibilities varied across projects; no production data is represented.</text></g></svg>