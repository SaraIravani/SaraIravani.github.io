<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="t d"><title id="t">DevOps team collaboration and delivery workflow</title><desc id="d">Illustrative collaboration between development, TFS delivery workflows, infrastructure operations, and monitoring.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09172e"/><stop offset="1" stop-color="#173b69"/></linearGradient></defs><rect width="1600" height="820" rx="28" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="90" y="90" fill="#93c5fd" font-size="23" letter-spacing="4">DEVOPS TEAM DEVELOPMENT</text><text x="90" y="150" fill="#fff" font-size="43" font-weight="700">Connecting development, delivery &amp; operations</text><g fill="#102b50" stroke="#3b82f6" stroke-width="2"><rect x="90" y="285" width="310" height="210" rx="22"/><rect x="490" y="285" width="310" height="210" rx="22"/><rect x="890" y="285" width="310" height="210" rx="22"/><rect x="1290" y="285" width="220" height="210" rx="22"/></g><g stroke="#60a5fa" stroke-width="4" fill="none"><path d="M400 390H490M800 390H890M1200 390H1290"/></g><g fill="#fff"><text x="245" y="350" text-anchor="middle" font-size="29" font-weight="700">Development</text><text x="245" y="400" text-anchor="middle" fill="#c7d9f2" font-size="21">Application needs</text><text x="245" y="440" text-anchor="middle" fill="#c7d9f2" font-size="21">Team collaboration</text><text x="645" y="350" text-anchor="middle" font-size="29" font-weight="700">Delivery</text><text x="645" y="400" text-anchor="middle" fill="#c7d9f2" font-size="21">TFS · CI/CD workflows</text><text x="645" y="440" text-anchor="middle" fill="#c7d9f2" font-size="21">PowerShell · Shell</text><text x="1045" y="350" text-anchor="middle" font-size="29" font-weight="700">Operations</text><text x="1045" y="400" text-anchor="middle" fill="#c7d9f2" font-size="21">Infrastructure support</text><text x="1045" y="440" text-anchor="middle" fill="#c7d9f2" font-size="21">Data center coordination</text><text x="1400" y="370" text-anchor="middle" font-size="25" font-weight="700">Feedback</text><text x="1400" y="415" text-anchor="middle" fill="#c7d9f2" font-size="20">Monitoring</text></g><rect x="370" y="590" width="860" height="115" rx="18" fill="#12345d" stroke="#38bdf8" stroke-width="2"/><text x="800" y="638" text-anchor="middle" fill="#fff" font-size="29" font-weight="700">Five-person DevOps team</text><text x="800" y="677" text-anchor="middle" fill="#c7d9f2" font-size="21">Monitoring · delivery · automation · infrastructure operations</text><text x="90" y="770" fill="#9db7d7" font-size="18">Illustrative collaboration model based on the team's areas of focus; not a claim of a specific automated toolchain.</text></g></svg>