<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="t d"><title id="t">Illustrative Active Directory parent and child domain lab topology</title><desc id="d">A lab-only corp.lab forest root, software.corp.lab child domain, directory objects, policies and a Windows client.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#09172e"/><stop offset="1" stop-color="#15375f"/></linearGradient><linearGradient id="c" x2="1" y2="1"><stop stop-color="#12345d"/><stop offset="1" stop-color="#0d2545"/></linearGradient></defs><rect width="1600" height="860" rx="28" fill="url(#b)"/><g font-family="Arial,sans-serif"><text x="90" y="88" fill="#93c5fd" font-size="23" letter-spacing="4">TECHNICAL DEMONSTRATION · LAB ONLY</text><text x="90" y="145" fill="#fff" font-size="42" font-weight="700">Example parent / child domain topology</text><rect x="480" y="195" width="640" height="130" rx="18" fill="url(#c)" stroke="#60a5fa" stroke-width="2"/><text x="800" y="245" text-anchor="middle" fill="#fff" font-size="31" font-weight="700">corp.lab</text><text x="800" y="285" text-anchor="middle" fill="#c7d9f2" font-size="20">Example forest-root domain</text><path d="M800 325V385" stroke="#60a5fa" stroke-width="4"/><rect x="420" y="385" width="760" height="130" rx="18" fill="url(#c)" stroke="#38bdf8" stroke-width="2"/><text x="800" y="438" text-anchor="middle" fill="#fff" font-size="31" font-weight="700">software.corp.lab</text><text x="800" y="477" text-anchor="middle" fill="#c7d9f2" font-size="20">Example child domain · software department</text><path d="M800 515V565M265 565H1335M265 565V610M800 565V610M1335 565V610" stroke="#60a5fa" stroke-width="4" fill="none"/><g fill="url(#c)" stroke="#3b82f6" stroke-width="2"><rect x="90" y="610" width="350" height="160" rx="16"/><rect x="625" y="610" width="350" height="160" rx="16"/><rect x="1160" y="610" width="350" height="160" rx="16"/></g><g fill="#fff" text-anchor="middle"><text x="265" y="662" font-size="25" font-weight="700">Directory objects</text><text x="265" y="704" fill="#c7d9f2" font-size="19">OUs · users · security groups</text><text x="265" y="738" fill="#c7d9f2" font-size="19">Team-based access</text><text x="800" y="662" font-size="25" font-weight="700">Policies</text><text x="800" y="704" fill="#c7d9f2" font-size="19">Password · lockout</text><text x="800" y="738" fill="#c7d9f2" font-size="19">Workstation GPO</text><text x="1335" y="662" font-size="25" font-weight="700">Test endpoint</text><text x="1335" y="704" fill="#c7d9f2" font-size="19">Windows client VM</text><text x="1335" y="738" fill="#c7d9f2" font-size="19">Domain sign-in · policy test</text></g><text x="90" y="820" fill="#93c5fd" font-size="18">Generic lab names only. Conceptual learning topology, not the Mahan Air production design.</text></g></svg>