<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="t d"><title id="t">Active Directory responsibility timeline</title><desc id="d">Approximately two years administering the software subdomain, then integration into main Active Directory and focus on monitoring.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#0b1931"/><stop offset="1" stop-color="#173b69"/></linearGradient><linearGradient id="a"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><rect width="1600" height="560" rx="26" fill="url(#b)"/><g font-family="Arial,sans-serif"><text x="90" y="88" fill="#93c5fd" font-size="23" letter-spacing="4">RESPONSIBILITY TIMELINE</text><path d="M180 275H1420" stroke="#6b91c4" stroke-width="8" stroke-linecap="round"/><path d="M180 275H800" stroke="url(#a)" stroke-width="8" stroke-linecap="round"/><circle cx="300" cy="275" r="22" fill="#38bdf8" stroke="#dbeafe" stroke-width="6"/><circle cx="1150" cy="275" r="22" fill="#38bdf8" stroke="#dbeafe" stroke-width="6"/><text x="130" y="170" fill="#fff" font-size="31" font-weight="700">Phase 1 · ~2 years</text><text x="130" y="215" fill="#c7d9f2" font-size="22">Created and administered the</text><text x="130" y="245" fill="#c7d9f2" font-size="22">software department subdomain</text><text x="900" y="170" fill="#fff" font-size="31" font-weight="700">Phase 2 · After integration</text><text x="900" y="215" fill="#c7d9f2" font-size="22">Joined the main AD environment;</text><text x="900" y="245" fill="#c7d9f2" font-size="22">focus shifted toward monitoring</text><text x="130" y="350" fill="#93c5fd" font-size="20">Users · groups · GPO · password policy · PC access</text><text x="900" y="350" fill="#93c5fd" font-size="20">Monitoring implementation · ELK · SCOM</text><text x="90" y="490" fill="#9db7d7" font-size="18">Approximate timeline based on work-history recollection; internal topology is not disclosed.</text></g></svg>